<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Image Keeper</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="favicon.ico" sizes="16x16 24x24 32x32 48x48 64x64">
<link rel="manifest" href="manifest.webmanifest">
<script>try { var t = localStorage.getItem("imagekeeper-theme"); if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t); } catch (e) { /* storage blocked: follow the system setting */ }</script>
<style>
  /* ===== Theme tokens =====
     Default profile (personal brand), light, on :root. Other profiles override these through a data-profile attribute selector
     (:root[data-profile="..."]); light/dark is the data-theme attribute or the system setting, as before.
     Palette: Midnight #253D52, Warm gray #525254, Mist bg #EEF2F7, Muted blue #4880AE, Soft sky #A0C2DB, Mist gray #9A9AA4, Muted Blue Dark #325A7A */
  :root {
    --bg: #EEF2F7; --card: #FFFFFF; --field: #FFFFFF; --field-locked: #EEF2F7;
    --text: #253D52; --muted: #525254; --heading: #253D52;
    --line: #4880AE; --card-line: transparent;                        /* --line: borders of buttons and fields; --card-line: edge of cards, boxes and the header */
    --accent: #4880AE; --accent-bg: #EEF2F7; --focus: #4880AE;        /* never used as text colour: rings, drop line, focus */
    --active-bg: #EEF2F7; --icon: #4880AE;                                                /* the small symbols in the header list */
    --cta-bg: #253D52; --cta-text: #FFFFFF; --btn-bg: #325A7A; --btn-text: #FFFFFF; --btn-line: #325A7A;
    --sig: rgba(72, 128, 174, .14);                                   /* the decorative corner circle */
    --ok: #217a3c; --bad: #c62828;                                    /* page background only (backup line) */
    --warn: #9a5b00; --warn-bg: #fff4d6; --warn-line: #9a5b00; --err-bg: #fde4e4; --err-line: #c62828;
    --cardw: 1060px; --idxw: 528px; --texth: 400px; --fs: 14px; --hdr: 76px; --hdr-min: 76px;   /* --hdr = the real header height, set from the page (see below) */
    --radius-card: 14px; --radius-ctl: 8px; --radius-btn: 8px; --radius-field: 10px; --radius-area: 12px; --radius-line: 2px;
    --font-ui: Arial, Helvetica, sans-serif; --font-mono: Consolas, "Courier New", monospace;
    --fw-normal: 400; --fw-strong: 700; --fw-head: 700; --cta-size: 14px; --cta-weight: 400; --h1-size: 18px; --h1-lh: 22px;
    --logo-w: 190px; --logo-plate: transparent; --logo-plate-pad: 0;      /* only used by a profile that shows a logo */
    --circle: radial-gradient(circle 220px at calc(100% - 110px) 70px, var(--sig) 219px, transparent 220px);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #253D52; --card: #325A7A; --field: #253D52; --field-locked: #325A7A;
      --text: #FFFFFF; --muted: #EEF2F7; --heading: #FFFFFF;
      --line: #A0C2DB; --accent: #A0C2DB; --accent-bg: #253D52; --focus: #A0C2DB; --active-bg: #253D52; --icon: #A0C2DB;
      --cta-bg: #A0C2DB; --cta-text: #253D52; --btn-bg: #EEF2F7; --btn-text: #253D52; --btn-line: #EEF2F7; --sig: rgba(160, 194, 219, .12);
      --ok: #6fcf8a; --bad: #ff8a80;
      --warn: #ffc766; --warn-bg: #3b3317; --warn-line: #ffc766; --err-bg: #3d1d1d; --err-line: #ff9d94;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #253D52; --card: #325A7A; --field: #253D52; --field-locked: #325A7A;
    --text: #FFFFFF; --muted: #EEF2F7; --heading: #FFFFFF;
    --line: #A0C2DB; --accent: #A0C2DB; --accent-bg: #253D52; --focus: #A0C2DB; --active-bg: #253D52; --icon: #A0C2DB;
    --cta-bg: #A0C2DB; --cta-text: #253D52; --btn-bg: #EEF2F7; --btn-text: #253D52; --btn-line: #EEF2F7; --sig: rgba(160, 194, 219, .12);
    --ok: #6fcf8a; --bad: #ff8a80;
    --warn: #ffc766; --warn-bg: #3b3317; --warn-line: #ffc766; --err-bg: #3d1d1d; --err-line: #ff9d94;
    color-scheme: dark;
  }
  /* Image Keeper-only tokens: the preview stage and the thumbnail wells. They follow --field and --field-locked everywhere except Mint dark, where the
     approved option C uses a neutral grey for both. They live here, not in mint-profile.js, so that file stays identical to NoteTaker's. */
  :root { --stage: var(--field); --thumb: var(--field-locked); }
  @media (prefers-color-scheme: dark) { :root[data-profile="mint"]:not([data-theme="light"]) { --stage: #1C1C1C; --thumb: #1C1C1C; } }
  :root[data-profile="mint"][data-theme="dark"] { --stage: #1C1C1C; --thumb: #1C1C1C; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--circle) fixed, var(--bg); color: var(--text); font: 14px/1.4 var(--font-ui); }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  /* ===== Image Keeper layout ===== */
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }
  header { flex: none; min-height: var(--hdr-min); background: var(--circle) fixed, var(--bg); padding: 0 16px; display: flex; align-items: center; gap: 12px; }
  h1 { font-size: var(--h1-size); line-height: var(--h1-lh); margin: 0; font-weight: var(--fw-head); color: var(--heading); }
  .hright { display: flex; align-items: center; gap: 12px; margin-left: auto; }
  button { font: inherit; padding: 4px 10px; border: 1px solid var(--line); border-radius: var(--radius-btn); background: transparent; color: var(--text); cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.primary { background: var(--cta-bg); border-color: var(--cta-bg); color: var(--cta-text); font-size: var(--cta-size); font-weight: var(--cta-weight); }
  button.btn-save { background: var(--btn-bg); border-color: var(--btn-line); color: var(--btn-text); }
  #themeBtn { white-space: nowrap; }
  #profileBox { display: inline-flex; align-items: center; gap: 8px; }
  #profileBox[hidden] { display: none; }
  #profileLabel { font-size: 12px; color: var(--muted); font-weight: var(--fw-strong); white-space: nowrap; }
  .segbtns { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-btn); }
  .segbtns button { border: 0; border-radius: 0; padding: 4px 12px; font-weight: var(--fw-strong); white-space: nowrap; }
  .segbtns button:first-child { border-radius: var(--radius-btn) 0 0 var(--radius-btn); }
  .segbtns button:last-child { border-radius: 0 var(--radius-btn) var(--radius-btn) 0; }
  .segbtns button[aria-pressed="true"] { background: var(--btn-bg); color: var(--btn-text); }
  .segbtns button:hover:not(:disabled):not([aria-pressed="true"]) { background: var(--accent-bg); }
  .banner { flex: none; margin: 0 16px 10px; padding: 8px 12px; border-radius: var(--radius-ctl); border: 1px solid; display: flex; gap: 12px; align-items: flex-start; white-space: pre-line; }
  .banner > span { flex: 1; }
  .banner.warn { background: var(--warn-bg); border-color: var(--warn-line); }
  .banner.err { background: var(--err-bg); border-color: var(--err-line); }
  #layout { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(300px, clamp(300px, 32vw, 560px)) minmax(0, 1fr); gap: 16px; padding: 4px 16px 16px; }
  #side { display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
  #logoSlot { display: none; flex: none; align-self: flex-start; }
  .box { background: var(--card); border: 1px solid var(--card-line); border-radius: var(--radius-card); padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; min-width: 0; }
  #side .box { flex: 1; }
  #q { width: 100%; font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--radius-btn); background: var(--field); color: var(--text); }
  ::placeholder { color: var(--muted); opacity: 1; }
  .tools { display: flex; gap: 8px; align-items: center; }
  .tools #q { flex: 1; min-width: 0; width: auto; }
  #discardAllBtn { white-space: nowrap; }
  #sortSel { width: 100%; font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--radius-btn); background: var(--field); color: var(--text); }
  #confirmAll p { margin: 0 0 6px; } #confirmAll p.lead { font-weight: var(--fw-strong); }
  #confirmAll form > div:last-child { margin-top: 14px; }
  /* labels: filter chips, the rename/sort row, the per-image label field and its suggestion list. Theme tokens only. */
  #chips { display: flex; flex-wrap: wrap; gap: 6px; max-height: 28vh; overflow-y: auto; padding: 5px; margin: -5px; }      /* the padding keeps the focus ring of an edge chip from being clipped */
  .chip { display: inline-flex; align-items: baseline; gap: 6px; max-width: 100%; padding: 2px 10px; font-size: 13px; line-height: 1.5; }
  .chip .cn { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip .cc { font-weight: var(--fw-normal); flex: none; }
  .chip[aria-pressed="true"] { background: var(--text); border-color: var(--text); color: var(--bg); font-weight: var(--fw-strong); }
  .chip[aria-pressed="true"] .cc { font-weight: var(--fw-strong); }
  .chip[aria-pressed="true"] .cn::before { content: "\2713\00a0"; }
  .tools2 { display: flex; gap: 8px; align-items: center; }
  .tools2 #sortSel { flex: 1; min-width: 0; width: auto; }
  #renameBtn { white-space: nowrap; }
  #renameDlg input { width: 100%; font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: var(--radius-btn); background: var(--field); color: var(--text); }
  #renameDlg p.lead { margin: 0 0 8px; font-weight: var(--fw-strong); }
  #renameDlg p.err { color: var(--text); background: var(--err-bg); border: 1px solid var(--err-line); border-radius: var(--radius-ctl); padding: 4px 8px; margin: 8px 0 0; }
  #renameDlg p.err[hidden] { display: none; }
  #renameDlg form > div:last-child, #mergeDlg form > div:last-child { margin-top: 14px; }
  #mergeDlg p { margin: 0 0 6px; } #mergeDlg p.lead { font-weight: var(--fw-strong); }
  .s .when { flex: none; white-space: nowrap; }      /* the date is never truncated; the label pill takes what is left */
  .label-in { flex: 1 1 0; min-width: 0; width: 0; font: inherit; font-size: 12px; line-height: 1.3; padding: 1px 8px; border: 1px solid var(--line); border-radius: 999px; background: var(--accent-bg); color: var(--text); text-overflow: ellipsis; }
  #labelPop { position: fixed; z-index: 20; background: var(--field); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius-ctl); padding: 2px; max-height: 220px; overflow-y: auto; font-size: 13px; }
  #labelPop[hidden] { display: none; }
  #labelPop .opt { padding: 3px 8px; border-radius: 4px; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #labelPop .opt.new { font-style: italic; }
  #labelPop .opt[aria-selected="true"] { background: var(--text); color: var(--bg); }
  #list { flex: 1; min-height: 0; overflow: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-content: start; align-items: start; }
  .item { display: flex; flex-direction: column; gap: 4px; padding: 6px; border: 1px solid transparent; border-radius: var(--radius-field); cursor: pointer; min-width: 0; }
  .item:hover { border-color: var(--line); }
  .item.active { background: var(--active-bg); border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .item[hidden] { display: none; }
  .title { width: 100%; min-width: 0; font: inherit; font-weight: var(--fw-strong); padding: 3px 6px; border: 1px solid var(--line); border-radius: var(--radius-field); background: var(--field); color: var(--text); }
  .thumb { height: 120px; border-radius: 6px; background: var(--thumb); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .thumb img { max-width: 100%; max-height: 100%; display: block; }
  .s { font-size: 11px; color: var(--muted); display: flex; gap: 8px; flex-wrap: nowrap; align-items: center; min-width: 0; }
  .badge { flex: none; color: var(--ok); font-weight: var(--fw-strong); border: 1px solid var(--ok); border-radius: 999px; padding: 0 6px; font-size: 10px; text-transform: uppercase; letter-spacing: .03em; }
  .nomatch { color: var(--muted); font-size: 12px; padding: 6px 8px; grid-column: 1 / -1; }
  #preview { min-width: 0; }
  #phead { flex: none; display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  #phead[hidden] { display: none; }
  #pinfo { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  #pmeta { font-size: 12px; color: var(--muted); }
  #pbtns { display: flex; gap: 6px; flex-wrap: wrap; }
  #stage { flex: 1; min-height: 0; display: flex; border-radius: var(--radius-field); background: var(--stage); border: 1px solid var(--line); overflow: hidden; }
  #stage img { display: block; margin: auto; }
  #stage.fit img { max-width: 100%; max-height: 100%; object-fit: contain; }
  #stage.actual { overflow: auto; display: block; }
  #stage.actual img { margin: 0; max-width: none; max-height: none; }
  #emptyMsg { margin: auto; color: var(--muted); font-size: 16px; padding: 16px; text-align: center; }
  #msg { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); z-index: 30; background: var(--text); color: var(--bg); padding: 6px 14px; border-radius: var(--radius-ctl); font-size: 13px; pointer-events: none; opacity: 0; transition: opacity .2s; max-width: 80vw; }
  #msg.show { opacity: 1; }
  body.dragging::after { content: "Drop to add"; position: fixed; inset: 8px; z-index: 40; border: 3px dashed var(--accent); border-radius: var(--radius-card); background: rgba(128,128,128,.12); display: flex; align-items: center; justify-content: center; font-size: 22px; color: var(--text); pointer-events: none; }
  dialog { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: var(--radius-card); padding: 16px 18px; max-width: 420px; }
  dialog::backdrop { background: rgba(0,0,0,.45); }
  dialog p { margin: 0 0 14px; }
  dialog .pbtns { display: flex; gap: 8px; justify-content: flex-end; }
  @media (max-width: 820px) { #layout { grid-template-columns: minmax(0, 1fr); grid-auto-rows: minmax(300px, 1fr); } }
</style>
<!-- Optional profile file. Blocking on purpose: when present it adds its look before the first paint. When it is absent this request fails (one 404 line in the server log and the console, nothing else) and the app runs in Default. -->
<script src="mint-profile.js" onerror="window.__mintMissing = true"></script>
<script>
// ===== <profile-logic> (no DOM access; unit-tested by Testing/profiles-phase3-unit.mjs) =====
const PROFILE_KEY = "imagekeeper-profile";
// stored = what localStorage holds ("mint", "default", anything else, or null); mintAvailable = mint-profile.js loaded.
// A stored "mint" is kept (not rewritten) when the file is missing: the Default look is shown and fellBack says so.
function resolveProfile(stored, mintAvailable) {
  if (stored === "mint") return mintAvailable ? { profile: "mint", fellBack: false } : { profile: "default", fellBack: true };
  return { profile: "default", fellBack: false };
}
function themeLabel(isDark) {
  return isDark ? { text: "\u2600 Light", title: "Switch to light mode" } : { text: "\u263E Dark", title: "Switch to dark mode" };
}
// ===== </profile-logic> =====
(function () {
  var stored = null; try { stored = localStorage.getItem(PROFILE_KEY); } catch (e) { /* storage blocked: Default */ }
  var r = resolveProfile(stored, !!window.NoteTakerMint);
  window.__profileState = { stored: stored, resolved: r.profile, fellBack: r.fellBack, available: !!window.NoteTakerMint };
  if (r.profile === "mint") document.documentElement.setAttribute("data-profile", "mint");
})();
</script>
</head>
<body>
<header>
  <h1>Image Keeper</h1>
  <div class="hright">
    <div id="profileBox" hidden>
      <span id="profileLabel">Profile</span>
      <div class="segbtns" role="group" aria-label="Profile">
        <button type="button" data-profile="default" aria-pressed="true">Default</button>
        <button type="button" data-profile="mint" aria-pressed="false">Mint</button>
      </div>
    </div>
    <button id="themeBtn" type="button">Dark</button>
  </div>
</header>
<div id="banners"></div>
<div id="layout">
  <aside id="side">
    <span id="logoSlot"></span>
    <div class="box">
      <div class="tools">
        <input id="q" type="search" placeholder="Search titles" aria-label="Search titles" autocomplete="off">
        <button id="discardAllBtn" type="button" title="Discard every image in the tray" disabled>Discard All</button>
      </div>
      <div id="chips" role="group" aria-label="Filter by label"></div>
      <div class="tools2">
        <select id="sortSel" aria-label="Sort by">
          <option value="date-desc">Date: newest first</option>
          <option value="date-asc">Date: oldest first</option>
          <option value="title-asc">Title: A–Z</option>
          <option value="title-desc">Title: Z–A</option>
        </select>
        <button id="renameBtn" type="button" title="Rename the selected label (not available for All or General)" disabled>Rename label…</button>
      </div>
      <div id="list" role="listbox" aria-label="Images"></div>
    </div>
  </aside>
  <main id="preview" class="box">
    <div id="phead" hidden>
      <div id="pinfo">
        <input id="ptitle" class="title" aria-label="Title" autocomplete="off">
        <div id="pmeta"></div>
      </div>
      <div id="pbtns">
        <button id="fitBtn" type="button" title="Toggle between fit-to-pane and 100% size">100%</button>
        <button id="saveBtn" type="button" class="btn-save">Save…</button>
        <button id="discardBtn" type="button">Discard</button>
      </div>
    </div>
    <div id="stage" class="fit"><div id="emptyMsg">Paste (Ctrl+V) or drop an image</div></div>
  </main>
</div>
<div id="msg" role="status" aria-live="polite"></div>
<dialog id="confirm"><form method="dialog">
  <p id="confirmMsg"></p>
  <div class="pbtns"><button value="cancel" type="submit">Keep it</button><button value="ok" type="submit" class="primary">Discard</button></div>
</form></dialog>
<dialog id="confirmAll"><form method="dialog">
  <p id="caTitle" class="lead"></p>
  <p id="caLabel"></p>
  <p id="caSaved"></p>
  <p id="caHidden" hidden></p>
  <div class="pbtns"><button id="caCancel" value="cancel" type="submit" autofocus>Cancel</button><button id="caOk" value="ok" type="submit" class="primary"></button></div>
</form></dialog>
<dialog id="renameDlg"><form method="dialog">
  <p id="rnTitle" class="lead"></p>
  <input id="rnInput" maxlength="30" autocomplete="off" aria-label="New label name" aria-describedby="rnErr">
  <p id="rnErr" class="err" role="alert" hidden></p>
  <div class="pbtns"><button id="rnCancel" value="cancel" type="submit" formnovalidate>Cancel</button><button id="rnOk" value="ok" type="button" class="btn-save">Rename</button></div>
</form></dialog>
<dialog id="mergeDlg"><form method="dialog">
  <p id="mgTitle" class="lead"></p>
  <p id="mgBody"></p>
  <div class="pbtns"><button id="mgCancel" value="cancel" type="submit" autofocus>Cancel</button><button id="mgOk" value="ok" type="submit" class="btn-save">Merge</button></div>
</form></dialog>
<div id="labelPop" role="listbox" aria-label="Label suggestions" hidden></div>

<script>
// ===== <label-logic> (no DOM, no storage; unit-tested by Testing/labels-unit.mjs) =====
// Every image has exactly one label (item.label = its display form). Labels match case-insensitively through labelKey();
// all images with the same key share one display form (the first one created). "General" is the fallback; "All" is reserved for the All chip.
const LABEL_GENERAL = "General", LABEL_ALL = "All", LABEL_MAX = 30, KEY_GENERAL = "general", KEY_ALL = "all";
const labelCollator = new Intl.Collator(undefined, { numeric: true, sensitivity: "base" });
const labelKey = (s) => String(s).toLowerCase();
// Trimmed, inner runs of white space collapsed to one space, at most LABEL_MAX characters. May return "".
function cleanLabel(raw) {
  const s = String(raw == null ? "" : raw).replace(/\s+/g, " ").trim();
  return Array.from(s).slice(0, LABEL_MAX).join("").trim();
}
// raw = what the person typed; inUse = display forms of the labels that exist now.
// -> { ok: true, label } (empty -> General; "general" in any case -> General; a case-variant of an existing label -> that label's form)
// or { ok: false, reason: "reserved" } for "All" in any case.
function resolveLabel(raw, inUse) {
  const name = cleanLabel(raw);
  if (!name) return { ok: true, label: LABEL_GENERAL };
  const k = labelKey(name);
  if (k === KEY_ALL) return { ok: false, reason: "reserved" };
  if (k === KEY_GENERAL) return { ok: true, label: LABEL_GENERAL };
  const hit = (inUse || []).find((l) => labelKey(l) === k);
  return { ok: true, label: hit || name };
}
// Stored records written before labels existed (no label), or with a label that breaks the rules, become General; images whose labels differ only
// in case get the form of the earliest-added one. Works on the array in place and returns it. Never touches anything but .label.
function normalizeLoadedLabels(list) {
  const form = new Map();
  for (const it of [...list].sort((a, b) => (a.added || 0) - (b.added || 0))) {
    const c = typeof it.label === "string" ? cleanLabel(it.label) : "";
    const k = labelKey(c);
    if (!c || k === KEY_ALL || k === KEY_GENERAL) { it.label = LABEL_GENERAL; continue; }
    if (!form.has(k)) form.set(k, c);
    it.label = form.get(k);
  }
  return list;
}
// The chip row: All, General (always, even at 0), then the other labels alphabetically. [{ key, label, count }]
function chipList(list) {
  const by = new Map();
  for (const it of list) { const k = labelKey(it.label); const e = by.get(k); if (e) e.count++; else by.set(k, { key: k, label: it.label, count: 1 }); }
  const gen = by.get(KEY_GENERAL) || { key: KEY_GENERAL, label: LABEL_GENERAL, count: 0 };
  by.delete(KEY_GENERAL);
  const rest = [...by.values()].sort((a, b) => labelCollator.compare(a.label, b.label) || (a.label < b.label ? -1 : a.label > b.label ? 1 : 0));
  return [{ key: KEY_ALL, label: LABEL_ALL, count: list.length }, gen, ...rest];
}
const isCustomChip = (key) => key !== KEY_ALL && key !== KEY_GENERAL;
// The remembered chip if it still exists, otherwise All.
function pickChip(stored, list) { return typeof stored === "string" && chipList(list).some((c) => c.key === stored) ? stored : KEY_ALL; }

  const vis = visibleSorted(), i = vis.findIndex((x) => x.id === it.id);
  it.label = r.label; persist(it);
  renderChips(); applyFilter();
  const li = rows.get(it.id);
  if (selectedId === it.id && li && li.hidden) { const next = vis[i + 1] || vis[i - 1] || null; select(next ? next.id : null); }      // it left the chip being shown
}
$("list").addEventListener("scroll", closePop);
addEventListener("resize", closePop);

// ---------- labels: rename / merge (the chip itself) ----------
function askRename(cur) {
  const d = $("renameDlg"), inp = $("rnInput"), err = $("rnErr"); let plan = null;
  $("rnTitle").textContent = "Rename label “" + cur.label + "” (" + cur.count + (cur.count === 1 ? " image" : " images") + ")";
  inp.value = cur.label; err.hidden = true; err.textContent = "";
  const submit = () => {
    const p = planRename(allItems(), cur.key, inp.value);
    if (p.kind === "error") { err.textContent = p.message; err.hidden = false; inp.focus(); return; }
    plan = p; d.close("ok");
  };
  const onKey = (e) => { if (e.key === "Enter") { e.preventDefault(); submit(); } };
  $("rnOk").onclick = submit; inp.onkeydown = onKey; inp.oninput = () => { err.hidden = true; };
  return new Promise((res) => { d.addEventListener("close", () => res(d.returnValue === "ok" ? plan : null), { once: true }); d.returnValue = "cancel"; d.showModal(); inp.focus(); inp.select(); });
}
function confirmMerge(plan) {
  const d = $("mergeDlg");
  $("mgTitle").textContent = "Merge “" + plan.from + "” into “" + plan.label + "”?";
  $("mgBody").textContent = "“" + plan.label + "” already exists (" + plan.intoCount + (plan.intoCount === 1 ? " image" : " images") + "). The " + plan.count + (plan.count === 1 ? " image" : " images") + " labelled “" + plan.from + "” will get that label, and the label “" + plan.from + "” will be gone.";
  return new Promise((res) => { d.addEventListener("close", () => res(d.returnValue === "ok"), { once: true }); d.returnValue = "cancel"; d.showModal(); $("mgCancel").focus(); });
}
async function renameChip() {
  if (busy || !isCustomChip(chipKey)) return;
  const cur = chipList(allItems()).find((c) => c.key === chipKey); if (!cur) return;
  const plan = await askRename(cur); if (!plan || plan.kind === "noop") return;
  if (plan.kind === "merge" && !(await confirmMerge(plan))) return;
  const hit = itemsInScope(allItems(), cur.key), before = hit.map((x) => x.label), newLabel = plan.label;
  applyRename(allItems(), cur.key, newLabel);
  try { if (!dbBroken) await dbPutMany(hit); }
  catch (e) { hit.forEach((x, n) => { x.label = before[n]; }); banner("err", "Could not store the new label in the browser (" + errStr(e) + "). Nothing was renamed."); return; }
  setChip(labelKey(newLabel)); buildRows(); if (selectedId) select(selectedId, true);
  toast(plan.kind === "merge" ? "Merged " + hit.length + (hit.length === 1 ? " image" : " images") + " into “" + newLabel + "”" : "Renamed to “" + newLabel + "”");
}
$("renameBtn").addEventListener("click", renameChip);

// ---------- preview ----------
function select(id, scroll) {
  selectedId = id; markActive(); renderPreview();
  if (scroll) { const li = rows.get(id); if (li) li.scrollIntoView({ block: "nearest" }); }
}
let shownId = null;                   // the image the stage is showing; selecting it again keeps the same <img> (no reload, no flicker)
function renderPreview() {
  const it = items.get(selectedId), stage = $("stage");
  if (!it) {
    if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
    shownId = null; stage.replaceChildren(); $("phead").hidden = true;
    const m = document.createElement("div"); m.id = "emptyMsg"; m.textContent = "Paste (Ctrl+V) or drop an image"; stage.append(m); return;
  }
  $("phead").hidden = false;
  if (document.activeElement !== $("ptitle")) $("ptitle").value = it.title;
  $("pmeta").textContent = fmtDate(it.added) + "  ·  " + typeLabel(it.type) + "  ·  " + it.width + " × " + it.height + "  ·  " + fmtSize(it.blob.size) + (it.saved ? "  ·  saved" : "");
  const shown = stage.querySelector("img");
  if (shown && shownId === it.id && previewUrl) { shown.alt = it.title; applyFit(); refreshButtons(); return; }
  if (previewUrl) { URL.revokeObjectURL(previewUrl); previewUrl = null; }
  stage.replaceChildren();
  previewUrl = URL.createObjectURL(it.blob); shownId = it.id;
  const im = document.createElement("img"); im.src = previewUrl; im.alt = it.title; im.draggable = false; stage.append(im);
  applyFit(); refreshButtons();
}
function applyFit() { $("stage").className = fit ? "fit" : "actual"; $("fitBtn").textContent = fit ? "100%" : "Fit"; $("fitBtn").title = fit ? "Show at 100% size (scrolls)" : "Fit to pane"; }
$("fitBtn").addEventListener("click", () => { fit = !fit; applyFit(); });
function refreshButtons() {
  $("saveBtn").disabled = busy; $("discardBtn").disabled = busy;
  $("discardAllBtn").disabled = busy || !scopeItems().length;
  $("discardAllBtn").title = chipKey === KEY_ALL ? "Discard every image in the tray" : "Discard every image labelled “" + chipLabel() + "”";
  $("renameBtn").disabled = busy || !isCustomChip(chipKey);
}

// ---------- save ----------
function stamp(ms) { const d = new Date(ms), p = (n) => String(n).padStart(2, "0"); return d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + "_" + p(d.getHours()) + p(d.getMinutes()); }
function suggestedName(it) {
  // Invalid characters become "_"; a run of spaces/underscores that holds at least one "_" collapses to a single "_" (plain runs of spaces stay);
  // "_" and spaces are trimmed from both ends, and trailing dots too (Windows does not allow them). Only the file name changes, never the title.
  const t = (it.title || "Untitled").replace(/[<>:"\/\\|?*\x00-\x1f]/g, "_").replace(/[ _]*_[ _]*/g, "_")
    .replace(/^[_ ]+/, "").replace(/[. _]+$/, "").slice(0, 80).replace(/[. _]+$/, "") || "Untitled";
  return t + " " + stamp(it.added) + "." + extOf(it.type);
}
async function saveSelected() {
  const it = items.get(selectedId); if (!it || busy) return;
  if (!window.showSaveFilePicker) { banner("err", "This browser has no Save dialog (showSaveFilePicker). Use Chrome."); return; }
  busy = true; refreshButtons();
  try {
    let handle;
    try {
      const opts = { id: "imagekeeper", suggestedName: suggestedName(it) };
      if (it.type) opts.types = [{ description: typeLabel(it.type) + " image", accept: { [it.type]: ["." + extOf(it.type)] } }];
      handle = await showSaveFilePicker(opts);
    } catch (e) {
      if (e && e.name === "AbortError") return;                  // cancelled: change nothing
      banner("err", "Could not open the Save dialog (" + errStr(e) + ")."); return;
    }
    try { const w = await handle.createWritable(); await w.write(it.blob); await w.close(); }
    catch (e) { banner("err", "The file was not written (" + errStr(e) + "). The image is not marked as saved."); return; }
    if (!items.has(it.id)) return;                               // discarded while the dialog was open
    it.saved = true; refreshSavedBadge(it); await persist(it);
    if (it.id === selectedId) renderPreview();
    toast("Saved as " + handle.name);
  } finally { busy = false; refreshButtons(); }
}
$("saveBtn").addEventListener("click", saveSelected);

// ---------- discard ----------
function confirmDiscard(title) {
  const d = $("confirm"); $("confirmMsg").textContent = "Discard “" + title + "”? It has not been saved, so it will be gone for good.";
  return new Promise((res) => { d.addEventListener("close", () => res(d.returnValue === "ok"), { once: true }); d.returnValue = "cancel"; d.showModal(); });
}
async function discardSelected() {
  const it = items.get(selectedId); if (!it || busy) return;
  if (!it.saved && !(await confirmDiscard(it.title))) return;
  const vis = sorted().filter((x) => rows.get(x.id) && !rows.get(x.id).hidden), i = vis.findIndex((x) => x.id === it.id);
  const next = vis[i + 1] || vis[i - 1] || null;
  try { if (!dbBroken) await dbDelete(it.id); }
  catch (e) { banner("err", "Could not delete the image from browser storage (" + errStr(e) + "). It was not discarded."); return; }
  items.delete(it.id); clearTimeout(saveTimers.get(it.id));
  buildRows(); select(next ? next.id : null);
}
$("discardBtn").addEventListener("click", discardSelected);

// Discard All: every item of the selected chip (all of them with All selected), saved or not, whatever the search shows; always confirmed first; Cancel has the focus.
function confirmDiscardAll(total, unsaved, hidden, label) {
  const d = $("confirmAll"), of = label ? " labelled “" + label + "”" : "";
  $("caTitle").textContent = total === 1 ? "Discard 1 image" + of + "?" : "Discard all " + total + " images" + of + "?";
  $("caLabel").textContent = "Label: " + (label || "All (every label)");
  $("caSaved").textContent = unsaved ? (unsaved === 1 ? "1 is not saved" : unsaved + " are not saved") + " and will be gone for good." : "All are saved.";
  $("caHidden").hidden = !hidden; $("caHidden").textContent = hidden ? "Including " + hidden + " hidden by the current search." : "";
  $("caOk").textContent = total === 1 ? "Discard 1 image" : "Discard all " + total;
  return new Promise((res) => { d.addEventListener("close", () => res(d.returnValue === "ok"), { once: true }); d.returnValue = "cancel"; d.showModal(); $("caCancel").focus(); });
}
async function discardAll() {
  const all = scopeItems(), whole = chipKey === KEY_ALL;
  if (!all.length || busy) return;
  const unsaved = all.filter((x) => !x.saved).length;
  let hidden = 0; all.forEach((x) => { const li = rows.get(x.id); if (li && li.hidden) hidden++; });
  if (!(await confirmDiscardAll(all.length, unsaved, hidden, whole ? null : chipLabel()))) return;
  try { if (!dbBroken) { if (whole) await dbClear(); else await dbDeleteMany(all.map((x) => x.id)); } }
  catch (e) { banner("err", "Could not delete the images from browser storage (" + errStr(e) + "). Nothing was discarded."); return; }
  all.forEach((x) => { clearTimeout(saveTimers.get(x.id)); saveTimers.delete(x.id); items.delete(x.id); });
  selectedId = null; query = ""; $("q").value = "";
  buildRows(); renderPreview();
  toast("Discarded " + all.length + (all.length === 1 ? " image" : " images"));
}
$("discardAllBtn").addEventListener("click", discardAll);

// ---------- light / dark mode ----------
function currentTheme() {
  const t = document.documentElement.getAttribute("data-theme");
  if (t === "dark" || t === "light") return t;
  return window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
}
function refreshThemeButton() {
  const l = themeLabel(currentTheme() === "dark"), b = $("themeBtn");
  b.textContent = l.text; b.title = l.title; b.setAttribute("aria-label", l.title);
}
$("themeBtn").addEventListener("click", () => {
  const next = currentTheme() === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("imagekeeper-theme", next); } catch (e) { /* storage blocked: lasts until the page is closed */ }
  refreshThemeButton();
});
if (window.matchMedia) { const mq = matchMedia("(prefers-color-scheme: dark)"); (mq.addEventListener ? mq.addEventListener("change", refreshThemeButton) : mq.addListener(refreshThemeButton)); }
refreshThemeButton();

// ---------- profile (Default | Mint) ----------
function currentProfile() { return document.documentElement.getAttribute("data-profile") === "mint" ? "mint" : "default"; }
function refreshProfileControl() {
  const box = $("profileBox"), on = currentProfile();
  box.hidden = !window.NoteTakerMint;
  box.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.profile === on)));
}
function applyProfile(p) {
  if (p === "mint" && window.NoteTakerMint) document.documentElement.setAttribute("data-profile", "mint"); else document.documentElement.removeAttribute("data-profile");
  try { localStorage.setItem(PROFILE_KEY, currentProfile()); } catch (e) { /* storage blocked */ }
  refreshProfileControl();
}
$("profileBox").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => applyProfile(b.dataset.profile)));
refreshProfileControl();

// ---------- start-up ----------
(async function init() {
  try {
    db = await openDb();
    const stored = await dbAll();
    normalizeLoadedLabels(stored).forEach((it) => { items.set(it.id, it); lastAdded = Math.max(lastAdded, it.added); });      // labels are set in memory only; nothing is written back here
  } catch (e) { dbBroken = true; banner("err", "Browser storage is unavailable (" + errStr(e) + "). Images can be added, but nothing is kept."); }
  { let stored = null; try { stored = localStorage.getItem(CHIP_KEY); } catch (e) { /* storage blocked: All */ } chipKey = pickChip(stored, allItems()); }
  buildRows(); renderPreview();
  if (window.__profileState && window.__profileState.fellBack) banner("warn", "The Mint profile file (mint-profile.js) was not found, so the Default look is shown. Your Mint choice is kept and applies again when the file is back.");
  if (navigator.storage && navigator.storage.persist) { try { await navigator.storage.persist(); } catch (e) { /* best effort */ } }
  if (navigator.locks) navigator.locks.request("imagekeeper-instance", { ifAvailable: true }, (lock) => {
    if (!lock) { banner("warn", "Image Keeper is already open in another tab or window. Close one of them: they do not see each other's changes."); return; }
    return new Promise(() => {});
  });
})();
</script>
</body></html>
